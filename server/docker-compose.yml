# Local development Postgres. Host port 5544 avoids clashing with any existing
# Postgres on 5432/5433. Data persists in the named volume across restarts.
services:
  db:
    image: postgres:16-alpine
    container_name: divya_seva_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: divya
      POSTGRES_PASSWORD: divya
      POSTGRES_DB: divya_seva
    ports:
      - "127.0.0.1:5544:5432"
    volumes:
      - divya_pgdata:/var/lib/postgresql/data

volumes:
  divya_pgdata:
